# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json

env:
  SETUP_GVM_VERSION: "v0.6.0" # https://github.com/andrewkroh/gvm/issues/44#issuecomment-1013231151
  SETUP_MAGE_VERSION: "1.15.0"
  JQ_VERSION: "1.7"
  DOCKER_IMG: "docker.elastic.co/package-registry/package-registry"
  DOCKER_IMG_PR: "docker.elastic.co/observability-ci/package-registry"
  # Agent images used in pipeline steps
  LINUX_GOLANG_AGENT_IMAGE: "golang:${SETUP_GOLANG_VERSION}"
  WINDOWS_AGENT_IMAGE: "family/core-windows-2022"
  MACOS_ARM_AGENT_IMAGE: "generic-13-ventura-arm"

steps:
  - label: ":golangci-lint: Checks formatting / linting"
    key: lint
    command:
      - ".buildkite/scripts/lint.sh"
    agents:
      image: "${LINUX_GOLANG_AGENT_IMAGE}"
      cpu: "8"
      memory: "4G"

  - label: ":hammer: Build"
    key: build
    command:
      - ".buildkite/scripts/build.sh"
    agents:
      image: "${LINUX_GOLANG_AGENT_IMAGE}"
      cpu: "8"
      memory: "4G"

  - label: ":bash: Test CI scripts (bats)"
    key: bats-tests
    command:
      - ".buildkite/scripts/bats-tests.sh"
    agents:
      image: "${LINUX_GOLANG_AGENT_IMAGE}"
      cpu: "4"
      memory: "2G"
    artifact_paths:
      - "tests-report-bats.xml"

  - label: ":wrench: Smoke tests running EPR with fake GCS server"
    key: smoke-test-fake-gcs-server
    command:
      - ".buildkite/scripts/test-epr-gcs.sh"
    agents:
      provider: "gcp"

  - label: ":lock: FIPS 140-3 build & test"
    key: fips-build-test
    command:
      - ".buildkite/scripts/test-fips.sh"
    agents:
      image: "${LINUX_GOLANG_AGENT_IMAGE}"
      cpu: "8"
      memory: "4G"

  - group: ":go: Run Unit tests"
    key: unit-tests
    steps:
      - label: ":linux: Test on Linux"
        key: test-linux
        command:
          - ".buildkite/scripts/run-tests.sh"
        agents:
          image: "${LINUX_GOLANG_AGENT_IMAGE}"
          cpu: "8"
          memory: "4G"
        artifact_paths:
          - "tests-report-linux.xml"

      - label: ":windows: Test on Windows"
        key: test-win
        command:
          - ".buildkite/scripts/run-tests.ps1"
        agents:
          provider: "gcp"
          image: "${WINDOWS_AGENT_IMAGE}"
        artifact_paths:
          - "tests-report-win.xml"

      - label: ":macos: Test on Macos ARM"
        key: test-macos-arm
        command:
          - ".buildkite/scripts/run-tests.sh"
        agents:
          provider: "orka"
          imagePrefix: "${MACOS_ARM_AGENT_IMAGE}"
        artifact_paths:
          - "tests-report-darwin.xml"

  - label: ":junit: Junit annotate"
    agents:
      # requires at least "bash", "curl" and "git"
      image: "docker.elastic.co/ci-agent-images/buildkite-junit-annotate:1.0"
    plugins:
      - junit-annotate#v2.7.0:
          artifacts: "tests-report-*.xml"
          fail-build-on-error: true
          report-skipped: true
          always-annotate: true
          run-in-docker: false
    depends_on:
      - step: "bats-tests"
        allow_failure: true
      - step: "test-linux"
        allow_failure: true
      - step: "test-win"
        allow_failure: true
      - step: "test-macos-arm"
        allow_failure: true

  - label: ":docker: Publish docker image"
    key: "publish"
    command: ".buildkite/scripts/publish.sh"
    # This step builds/pushes the images and, for each flavour, captures the pushed multi-arch index
    # digest from the buildx --metadata-file and uploads a digest file for signing. The digest is read
    # from the build result (not a registry read-back), so it is this build's exact image regardless of
    # any concurrent build repointing a tag. Serialize publishes in dispatch order
    # (concurrency_method: ordered) so the rolling :main tag always ends up pointing at the latest
    # build, instead of whichever of two overlapping publishes happens to push last. (Signing
    # correctness does not depend on this serialization -- the digest is captured at push time -- so it
    # is only :main rolling-tag hygiene.)
    #
    # The group key is per PR: branch and tag builds have BUILDKITE_PULL_REQUEST="false" so they share
    # one "...-publish-false" slot (where the :main / release-tag ordering matters), while each PR gets
    # its own "...-publish-<n>" slot. PR images only go to PR-<n> tags and never touch :main, so there
    # is no reason for them to queue behind other PRs or behind branch/tag publishes; this scopes the
    # serialization to a PR's own overlapping builds and keeps PRs from throttling each other. The env
    # var is interpolated at pipeline-upload time.
    concurrency: 1
    concurrency_group: "package-registry/package-registry-publish-${BUILDKITE_PULL_REQUEST}"
    concurrency_method: ordered
    agents:
      provider: "gcp"
    depends_on:
      - step: "test-linux"
        allow_failure: false
      - step: "test-win"
        allow_failure: false
      - step: "test-macos-arm"
        allow_failure: false
      - step: "build"
        allow_failure: false
      - step: "lint"
        allow_failure: false
      - step: "smoke-test-fake-gcs-server"
        allow_failure: false
      - step: "fips-build-test"
        allow_failure: false
    plugins:
      - elastic/vault-docker-login#v0.8.1:
          secret_path: 'kv/ci-shared/platform-ingest/elastic_docker_registry'
          # This step lasts more than 10 minutes, so the Vault token could have expired when the
          # plugin runs its pre-exit hook. The credentials are removed in .buildkite/hooks/pre-exit
          disable_logout: true

  - trigger: unified-release-container-image-signing
    label: ":key: Sign release container images"
    key: "sign-release-container-images"
    async: false
    build:
      env:
        ARTIFACT_PATTERN: "package-registry-*-images-digest.txt"
        UPLOAD_SIGNATURE: "true"
        IMAGES_TAG: "${BUILDKITE_TAG}"
    depends_on:
      - step: "publish"
        allow_failure: false
    # Release tag builds only (semver vX.Y.Z; prerelease tags intentionally excluded, matching the
    # dockerhub-copy and downstream steps). Sign them with the released version as the cosign tag annotation.
    if: build.tag =~ /^v\d+\.\d+\.\d+$$/

  - trigger: unified-release-container-image-signing
    label: ":key: Sign branch container images"
    key: "sign-branch-container-images"
    async: false
    build:
      env:
        ARTIFACT_PATTERN: "package-registry-*-images-digest.txt"
        UPLOAD_SIGNATURE: "true"
        IMAGES_TAG: "${BUILDKITE_BRANCH}-${BUILDKITE_COMMIT}"
    depends_on:
      - step: "publish"
        allow_failure: false
    # Non-PR branch builds (e.g. main) are public too; sign them with a controlled
    # <branch>-<commit> cosign tag annotation. PR images are not signed. The
    # BUILDKITE_PULL_REQUEST check matches the one publish.sh uses to gate signing.
    if: build.tag == null && build.env('BUILDKITE_PULL_REQUEST') == 'false'

  - trigger: unified-release-copy-elastic-images-to-dockerhub
    label: ":docker: Copy release images to Docker Hub"
    key: "copy-release-images-to-dockerhub"
    async: false
    build:
      env:
        IMAGES_NAMES: "package-registry/package-registry"
        IMAGES_TAG: "${BUILDKITE_TAG}"
    depends_on:
      - step: "publish"
        allow_failure: false
    # Release-only: gates dockerhub copy + downstream update, prerelease tags intentionally excluded.
    if: build.tag =~ /^v\d+\.\d+\.\d+$$/

  - trigger: unified-release-copy-elastic-images-to-dockerhub
    label: ":docker: Copy release UBI images to Docker Hub"
    key: "copy-release-ubi-images-to-dockerhub"
    async: false
    build:
      env:
        IMAGES_NAMES: "package-registry/package-registry"
        IMAGES_TAG: "${BUILDKITE_TAG}-ubi"
    depends_on:
      - step: "publish"
        allow_failure: false
    if: build.tag =~ /^v\d+\.\d+\.\d+$$/

  - trigger: unified-release-copy-elastic-images-to-dockerhub
    label: ":docker: Copy release FIPS images to Docker Hub"
    key: "copy-release-fips-images-to-dockerhub"
    async: false
    build:
      env:
        IMAGES_NAMES: "package-registry/package-registry"
        IMAGES_TAG: "${BUILDKITE_TAG}-fips"
    depends_on:
      - step: "publish"
        allow_failure: false
    if: build.tag =~ /^v\d+\.\d+\.\d+$$/

  - trigger: "package-storage-infra-update-package-registry"
    label: ":esbuild: Downstream - Update package registry"
    key: "downstream-update-package-registry"
    async: true
    build:
      branch: "main"
      env:
        DRY_RUN: "false"
        DRAFT_PR: "false"
        EPR_VERSION: "${BUILDKITE_TAG}"
    depends_on:
      - step: "publish"
        allow_failure: false
    if: build.tag =~ /^v\d+\.\d+\.\d+$$/
