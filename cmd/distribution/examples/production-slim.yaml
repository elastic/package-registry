# Production distribution: all packages across Kibana 8.15–9.5, 3 newest versions per matrix entry.
#
# Difference from an unrestricted "all" fetch (all=true, no keep):
#   An unrestricted fetch returns every historical version of every package
#   (~13 700 entries as of Sep 2025). This config uses keep: 3, which retains
#   the 3 newest compatible versions per package *per matrix entry* before
#   results are merged. The union across all Kibana versions in the matrix
#   typically yields ~2 500 entries — a ~5× reduction in image size — while
#   still guaranteeing that every Kibana release in the matrix has at least 3
#   installable versions of each package available offline.
#


# Base address of the Package Registry
address: "https://epr.elastic.co"

# Kibana release matrix. Each entry runs the query independently and keeps the 3 newest versions.
# spec.min / spec.max: REGISTRY_SPEC_MIN/MAX_VERSION from the Fleet plugin config.
matrix:
