# Packages to fetch. all=true returns every compatible version per matrix entry.
# security_detection_engine and system use keep: 4 to limit to the 4 newest versions.
queries:
  - package: apache
    all: true
  - package: apm
    all: true
  - package: elastic_agent
    all: true
  - package: endpoint
    all: true
  - package: fleet_server
    all: true
  - package: kubernetes
    all: true
  - package: linux
    all: true
  - package: log
    all: true
  - package: mysql
    all: true
  - package: nginx
    all: true
  - package: osquery_manager
    all: true
  - package: profiler_collector
    all: true
  - package: profiler_symbolizer
    all: true
  - package: security_ai_prompts
    all: true
  - package: security_detection_engine
    keep: 4
  - package: synthetics
    all: true
  - package: system
    keep: 4
  - package: windows
    all: true

actions:
  - print:
  - download:
      destination: ./build/distribution-lite
