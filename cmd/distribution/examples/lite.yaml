# Lite distribution
#
# Mirrors all historical and current versions of 18 core Elastic integration
# packages: apache, apm, elastic_agent, endpoint, fleet_server, kubernetes,
# linux, log, mysql, nginx, osquery_manager, profiler_collector,
# profiler_symbolizer, security_ai_prompts, security_detection_engine,
# synthetics, system, windows.
#
# Queries use all=true to return every compatible version, not just the latest
# per minor. The Kibana version matrix (7.17.x through 9.5.x) combined with
# spec.min/spec.max constraints — sourced from the Fleet plugin constants —
# gates which packages are eligible for each Kibana release.
#
# Prerelease packages (release: beta, 0.x versions) are included because the
# queries omit prerelease=true, which means EPR returns GA and beta-flagged
# packages but excludes hyphenated pre-release builds (-preview-*, -rc, -dev).

# Base address of the Package Registry
address: "https://epr.elastic.co"

# Queries are executed with each one of the parameters of the matrix.
#
# kibana.version: official Kibana release tags — https://github.com/elastic/kibana/tags
#
# spec.min / spec.max: REGISTRY_SPEC_MIN/MAX_VERSION constants from the Kibana Fleet plugin:
#   ≤8.17  x-pack/plugins/fleet/server/config.ts
#   ≥8.18  x-pack/platform/plugins/shared/fleet/server/config.ts
matrix:
  - kibana.version: 7.17.26
  - kibana.version: 7.17.27
  - kibana.version: 7.17.28
  - kibana.version: 7.17.29
  - kibana.version: 8.15.4
