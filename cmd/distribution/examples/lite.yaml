# Lite distribution: 18 core Elastic integration packages across Kibana 8.15–9.5.
# Beta-flagged packages are included; hyphenated pre-release builds (-preview-*, -rc, -dev) are not.

# Base address of the Package Registry
address: "https://epr.elastic.co"

